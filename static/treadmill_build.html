<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treadmill — Build</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="/static/common.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg); color: #fff;
      font-family: var(--font);
      min-height: 100vh;
      display: flex; flex-direction: column;
      max-width: 480px; margin: 0 auto;
    }

    /* ── HEADER — base look shared via common.css; sticky positioning
       is specific to this page (long scrolling step list below it) ── */
    .header { position: sticky; top: 0; background: var(--bg); z-index: 10; }

    /* ── SECTIONS ── */
    .section { padding: 20px 24px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 9px; letter-spacing: 3px; color: var(--dim); margin-bottom: 14px; }

    /* ── INPUTS ── */
    .field { margin-bottom: 14px; }
    .field label { font-size: 9px; letter-spacing: 2px; color: var(--dim); display: block; margin-bottom: 6px; }
    .field input, .field textarea, .field select {
      width: 100%; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; color: #fff; font-family: var(--font);
      font-size: 13px; padding: 10px 12px; outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--orange);
    }
    .field select option { background: var(--bg2); }

    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; }

    /* pace+slider combined */
    .pace-wrap { display: flex; flex-direction: column; gap: 6px; }
    .pace-inputs { display: flex; gap: 8px; align-items: center; }
    .pace-inputs input[type=text] { width: 80px; text-align: center; }
    .pace-eq { font-size: 10px; color: var(--dim); }
    .pace-kph { font-size: 13px; color: var(--orange); min-width: 60px; }
    input[type=range] { width: 100%; accent-color: var(--orange); cursor: pointer; }

    /* ── STEP LIST ── */
    .step-list { display: flex; flex-direction: column; gap: 8px; }

    .step-item {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .step-item.warmup   { border-left: 3px solid var(--amber); }
    .step-item.hard     { border-left: 3px solid var(--orange); }
    .step-item.recovery { border-left: 3px solid var(--green); }
    .step-item.cooldown { border-left: 3px solid var(--blue); }
    .step-item.steady   { border-left: 3px solid var(--orange); }
    .step-item.repeat-block { border-left: 3px solid var(--dim); }

    .step-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; cursor: pointer;
    }
    .step-icon { font-size: 14px; }
    .step-summary { flex: 1; }
    .step-summary .stype {
      font-size: 11px; letter-spacing: 2px;
    }
    .step-summary .sdetail { font-size: 10px; color: var(--dim); margin-top: 2px; }
    .step-actions { display: flex; gap: 6px; }
    .step-actions button {
      background: none; border: none; color: var(--dim);
      font-size: 14px; cursor: pointer; padding: 2px 4px;
      font-family: var(--font);
    }
    .step-actions button:hover { color: #fff; }
    .step-actions .del:hover { color: var(--red); }

    .step-editor {
      padding: 14px; border-top: 1px solid var(--border);
      display: none;
    }
    .step-editor.open { display: block; }

    /* repeat block children */
    .repeat-children {
      padding: 0 14px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .repeat-child {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .repeat-child.hard     { border-left: 3px solid var(--orange); }
    .repeat-child.recovery { border-left: 3px solid var(--green); }

    .add-child-btn {
      width: 100%; padding: 8px; margin-top: 6px;
      background: none; border: 1px dashed var(--border);
      color: var(--dim); font-size: 10px; letter-spacing: 2px;
      border-radius: 4px; cursor: pointer; font-family: var(--font);
      transition: border-color 0.2s, color 0.2s;
    }
    .add-child-btn:hover { border-color: var(--orange); color: var(--orange); }

    /* ── ADD STEP BUTTONS ── */
    .add-steps {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-top: 14px;
    }
    .add-btn {
      padding: 12px; background: var(--bg2);
      border: 1px dashed var(--border); border-radius: 4px;
      color: var(--dim); font-size: 10px; letter-spacing: 2px;
      cursor: pointer; font-family: var(--font);
      transition: all 0.2s;
    }
    .add-btn:hover { color: #fff; border-color: var(--dim); }
    .add-btn.repeat-btn { grid-column: span 2; }

    /* ── PREVIEW BAR ── */
    .preview-bar {
      display: flex; gap: 3px; margin-bottom: 14px;
      height: 8px; border-radius: 4px; overflow: hidden;
    }
    .preview-segment {
      border-radius: 2px; transition: flex 0.3s;
    }

    /* ── BUTTONS ── */
    .btn-row { display: flex; gap: 10px; }
    button.btn-primary {
      flex: 1; padding: 16px; background: var(--orange);
      color: #000; font-weight: bold; font-size: 12px;
      letter-spacing: 3px; border: none; border-radius: 4px;
      cursor: pointer; font-family: var(--font); transition: opacity 0.2s;
    }
    button.btn-primary:hover { opacity: 0.85; }
    button.btn-secondary {
      flex: 1; padding: 16px; background: var(--bg2);
      color: var(--dim); font-size: 12px; letter-spacing: 3px;
      border: 1px solid var(--border); border-radius: 4px;
      cursor: pointer; font-family: var(--font); transition: all 0.2s;
    }
    button.btn-secondary:hover { border-color: var(--dim); color: #fff; }
    button.btn-danger {
      flex: 1; padding: 16px; background: var(--bg2);
      color: var(--red); font-size: 12px; letter-spacing: 3px;
      border: 1px solid var(--red); border-radius: 4px;
      cursor: pointer; font-family: var(--font);
    }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--bg3); border: 1px solid var(--border);
      padding: 10px 20px; border-radius: 4px;
      font-size: 11px; letter-spacing: 2px;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    .toast.ok    { border-color: var(--orange); color: var(--orange); }
    .toast.error { border-color: var(--red);    color: var(--red); }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 6px; padding: 24px;
      width: 90%; max-width: 400px;
    }
    .modal-title {
      font-size: 11px; letter-spacing: 3px; color: var(--dim);
      margin-bottom: 16px;
    }
    .modal .btn-row { margin-top: 16px; }

    /* ── SAVED LIST ── */
    .saved-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 4px;
      margin-bottom: 8px;
    }
    .saved-item .sname { flex: 1; font-size: 13px; }
    .saved-item .sdesc { font-size: 10px; color: var(--dim); }
    .saved-item .sactions { display: flex; gap: 8px; }
    .saved-item .sactions button {
      background: none; border: none; color: var(--dim);
      font-size: 11px; letter-spacing: 1px; cursor: pointer;
      font-family: var(--font); padding: 4px 6px;
    }
    .saved-item .sactions button:hover { color: var(--orange); }
    .saved-item .sactions button.del:hover { color: var(--red); }

    .empty-state {
      text-align: center; padding: 24px;
      font-size: 11px; color: var(--dimmer); letter-spacing: 2px;
    }

    /* Wider layout for the 10.1" landscape touchscreen, matching the
       manual/workout screens, plus bigger touch targets on the add-step
       and footer buttons. Left un-centered vertically (unlike the other
       two screens) since this is a scrolling form/editor of variable
       length, not a fixed status readout. */
    @media (min-width: 700px) {
      body { max-width: 1000px; }
      .add-btn { padding: 16px; font-size: 11px; }
      button.btn-primary, button.btn-secondary, button.btn-danger { padding: 20px; font-size: 13px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">Treadmill</div>
  <nav class="nav">
    <a href="/">MANUAL</a>
    <a href="/workout">WORKOUT</a>
    <a href="/monitor">MONITOR</a>
    <a href="#" class="active">BUILD</a>
  </nav>
</div>

<!-- WORKOUT META -->
<div class="section">
  <div class="section-title">WORKOUT DETAILS</div>
  <div class="field">
    <label>NAME</label>
    <input type="text" id="workoutName" placeholder="e.g. 5×1km Intervals">
  </div>
  <div class="field">
    <label>DESCRIPTION</label>
    <input type="text" id="workoutDesc" placeholder="e.g. VO2 max session">
  </div>
</div>

<!-- PREVIEW BAR -->
<div class="section" style="padding-bottom:14px">
  <div class="section-title">PREVIEW</div>
  <div class="preview-bar" id="previewBar"></div>
  <div style="font-size:10px;color:var(--dim);display:flex;justify-content:space-between">
    <span id="previewSteps">0 steps</span>
    <span id="previewDuration">~0 min</span>
  </div>
</div>

<!-- STEP BUILDER -->
<div class="section">
  <div class="section-title">STEPS</div>
  <div class="step-list" id="stepList"></div>
  <div class="add-steps">
    <button class="add-btn" onclick="addStep('warmup')">+ WARMUP</button>
    <button class="add-btn" onclick="addStep('steady')">+ STEADY</button>
    <button class="add-btn" onclick="addStep('cooldown')">+ COOLDOWN</button>
    <button class="add-btn repeat-btn" onclick="addRepeatBlock()">+ REPEAT BLOCK</button>
  </div>
</div>

<!-- SAVE / LOAD -->
<div class="section">
  <div class="btn-row">
    <button class="btn-secondary" onclick="saveDraft()">SAVE DRAFT</button>
    <button class="btn-primary" onclick="saveToPi()">SAVE TO PI</button>
  </div>
  <div style="margin-top:10px">
    <button class="btn-secondary" style="width:100%;margin-top:0" onclick="newWorkout()">NEW WORKOUT</button>
  </div>
</div>

<!-- SAVED WORKOUTS -->
<div class="section">
  <div class="section-title">SAVED WORKOUTS</div>
  <div id="savedList"></div>
</div>

<!-- STEP EDITOR MODAL -->
<div class="modal-overlay" id="stepModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">EDIT STEP</div>

    <div class="field" id="typeField">
      <label>TYPE</label>
      <select id="editType" onchange="onTypeChange()">
        <option value="warmup">Warmup</option>
        <option value="hard">Hard</option>
        <option value="recovery">Recovery</option>
        <option value="steady">Steady</option>
        <option value="cooldown">Cooldown</option>
      </select>
    </div>

    <div class="field" id="triggerField">
      <label>TRIGGER</label>
      <select id="editTrigger" onchange="onTriggerChange()">
        <option value="time">Time</option>
        <option value="distance">Distance</option>
      </select>
    </div>

    <div class="field" id="durationField">
      <label>DURATION (mm:ss)</label>
      <input type="text" id="editDuration" placeholder="5:00">
    </div>

    <div class="field" id="distanceField" style="display:none">
      <label>DISTANCE (metres)</label>
      <input type="number" id="editDistance" placeholder="1000" min="50" step="50">
    </div>

    <div class="field">
      <label>PACE (mm:ss /km)</label>
      <div class="pace-wrap">
        <div class="pace-inputs">
          <input type="text" id="editPace" placeholder="4:30"
            oninput="onPaceInput(this.value)">
          <span class="pace-eq">=</span>
          <span class="pace-kph" id="paceKph">-- kph</span>
        </div>
        <input type="range" id="paceSlider" min="4" max="20" step="0.1" value="10"
          oninput="onPaceSlider(this.value)">
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--dim)">
          <span>4 kph · 15:00/km</span>
          <span>20 kph · 3:00/km</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label>INCLINE (%)</label>
      <div style="display:flex;align-items:center;gap:10px">
        <input type="range" id="editInclineSlider" min="0" max="15" step="0.5" value="0"
          oninput="document.getElementById('editInclineVal').textContent=parseFloat(this.value).toFixed(1)"
          style="flex:1;accent-color:var(--blue)">
        <span id="editInclineVal" style="min-width:36px;color:var(--blue);font-size:13px">0.0%</span>
      </div>
    </div>

    <div class="modal .btn-row btn-row">
      <button class="btn-secondary" onclick="closeModal()">CANCEL</button>
      <button class="btn-primary" onclick="saveStep()">SAVE STEP</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  // ── STATE ────────────────────────────────────────────────
  let workout = { name:'', description:'', steps:[] };
  let editingPath  = null;   // e.g. [2] or [2, 1] for child of repeat
  let editingIsNew = false;
  let editingParentIndex = null;

  // ── UTILITIES ────────────────────────────────────────────
  function paceToKph(pace) {
    const parts = pace.split(':');
    if (parts.length !== 2) return null;
    const m = parseInt(parts[0]), s = parseInt(parts[1]);
    if (isNaN(m) || isNaN(s)) return null;
    const total = m * 60 + s;
    if (total === 0) return null;
    return Math.round(3600 / total * 10) / 10;
  }
  function kphToPace(kph) {
    const sec = Math.round(3600 / kph);
    return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  }
  function parseDuration(str) {
    const parts = str.split(':');
    if (parts.length !== 2) return null;
    const m = parseInt(parts[0]), s = parseInt(parts[1]);
    if (isNaN(m) || isNaN(s)) return null;
    return m * 60 + s;
  }
  function formatDuration(secs) {
    return `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
  }
  function stepColor(type) {
    return { warmup:'#ffaa00', hard:'#ff8800', recovery:'#00cc66',
             cooldown:'#0088ff', steady:'#ff8800' }[type] || '#444';
  }
  function stepLabel(step) {
    if (step.trigger === 'time') return formatDuration(step.duration);
    return step.distance >= 1000
      ? (step.distance/1000).toFixed(1)+'km' : step.distance+'m';
  }
  function stepEstSeconds(step) {
    if (step.trigger === 'time') return step.duration;
    const kph = paceToKph(step.pace);
    if (!kph) return 0;
    return Math.round(step.distance / (kph / 3.6));
  }
  function uid() { return Math.random().toString(36).slice(2,8); }

  // ── RENDER STEP LIST ─────────────────────────────────────
  function renderSteps() {
    const list = document.getElementById('stepList');
    list.innerHTML = '';
    workout.steps.forEach((step, i) => {
      list.appendChild(buildStepEl(step, i, null));
    });
    renderPreview();
  }

  function buildStepEl(step, index, parentIndex) {
    const isRepeat = step.type === 'repeat';
    const el = document.createElement('div');
    el.className = `step-item ${isRepeat ? 'repeat-block' : step.type}`;

    // Header
    const header = document.createElement('div');
    header.className = 'step-header';

    const icon = isRepeat ? '🔁' :
      { warmup:'🌅', hard:'⚡', recovery:'🌿', cooldown:'❄️', steady:'➡️' }[step.type] || '▪';

    const detail = isRepeat
      ? `${step.count}× repeat · ${step.steps.length} steps`
      : `${step.pace}/km · ${stepLabel(step)}${step.incline ? ` · ${step.incline}%` : ''}`;

    const typeColor = isRepeat ? 'var(--dim)' : stepColor(step.type);

    header.innerHTML = `
      <span class="step-icon">${icon}</span>
      <div class="step-summary">
        <div class="stype" style="color:${typeColor}">${step.type.toUpperCase()}</div>
        <div class="sdetail">${detail}</div>
      </div>
      <div class="step-actions">
        ${!isRepeat ? `<button onclick="editStep(${index}, ${parentIndex})" title="Edit">✎</button>` : ''}
        <button onclick="moveStep(${index}, ${parentIndex}, -1)" title="Up">↑</button>
        <button onclick="moveStep(${index}, ${parentIndex}, 1)" title="Down">↓</button>
        <button class="del" onclick="deleteStep(${index}, ${parentIndex})" title="Delete">✕</button>
      </div>
    `;
    el.appendChild(header);

    if (isRepeat) {
      // Repeat count editor inline
      const repeatMeta = document.createElement('div');
      repeatMeta.style.cssText = 'padding:0 14px 10px;display:flex;align-items:center;gap:10px';
      repeatMeta.innerHTML = `
        <span style="font-size:9px;color:var(--dim);letter-spacing:2px">REPEAT</span>
        <input type="number" min="1" max="20" value="${step.count}"
          style="width:60px;background:var(--bg);border:1px solid var(--border);
                 border-radius:4px;color:#fff;font-family:var(--font);
                 font-size:13px;padding:6px 8px;outline:none"
          onchange="setRepeatCount(${index}, this.value)">
        <span style="font-size:10px;color:var(--dim)">times</span>
      `;
      el.appendChild(repeatMeta);

      // Children
      const children = document.createElement('div');
      children.className = 'repeat-children';
      step.steps.forEach((child, ci) => {
        const childEl = buildStepEl(child, ci, index);
        childEl.className = `repeat-child ${child.type}`;
        children.appendChild(childEl);
      });

      const addChild = document.createElement('button');
      addChild.className = 'add-child-btn';
      addChild.textContent = '+ ADD STEP TO REPEAT';
      addChild.onclick = () => openModal(null, index);
      children.appendChild(addChild);
      el.appendChild(children);
    }

    return el;
  }

  // ── STEP EDITING ─────────────────────────────────────────
  function addStep(type) {
    openModal({ type, trigger:'time', duration:300, pace:'5:00', incline:0 }, null, true);
  }

  function addRepeatBlock() {
    workout.steps.push({
      type:'repeat', count:4,
      steps:[
        { type:'hard',     trigger:'time', duration:60,  pace:'4:00', incline:0 },
        { type:'recovery', trigger:'time', duration:60,  pace:'5:30', incline:0 },
      ]
    });
    renderSteps();
    saveDraftSilent();
  }

  function editStep(index, parentIndex) {
    const step = parentIndex !== null
      ? workout.steps[parentIndex].steps[index]
      : workout.steps[index];
    openModal(step, parentIndex, false, index);
  }

  function deleteStep(index, parentIndex) {
    if (parentIndex !== null) {
      workout.steps[parentIndex].steps.splice(index, 1);
    } else {
      workout.steps.splice(index, 1);
    }
    renderSteps();
    saveDraftSilent();
  }

  function moveStep(index, parentIndex, dir) {
    const arr = parentIndex !== null
      ? workout.steps[parentIndex].steps
      : workout.steps;
    const newIdx = index + dir;
    if (newIdx < 0 || newIdx >= arr.length) return;
    [arr[index], arr[newIdx]] = [arr[newIdx], arr[index]];
    renderSteps();
    saveDraftSilent();
  }

  function setRepeatCount(index, val) {
    workout.steps[index].count = Math.max(1, parseInt(val) || 1);
    saveDraftSilent();
    renderPreview();
  }

  // ── MODAL ────────────────────────────────────────────────
  let _modalParentIndex = null;
  let _modalStepIndex   = null;
  let _modalIsNew       = false;
  let _modalDefaults    = null;

  function openModal(defaults, parentIndex, isNew, stepIndex) {
    _modalParentIndex = parentIndex !== undefined ? parentIndex : null;
    _modalStepIndex   = stepIndex !== undefined ? stepIndex : null;
    _modalIsNew       = isNew || false;
    _modalDefaults    = defaults;

    const d = defaults || { type:'hard', trigger:'time', duration:60, pace:'4:30', incline:0 };

    document.getElementById('modalTitle').textContent =
      isNew ? 'ADD STEP' : 'EDIT STEP';

    // Type
    const typeEl = document.getElementById('editType');
    typeEl.value = d.type || 'hard';
    // Hide type selector if adding child (type will be hard/recovery only)
    document.getElementById('typeField').style.display =
      (parentIndex !== null && isNew) ? 'none' : 'block';
    if (parentIndex !== null && isNew) typeEl.value = 'hard';

    // Trigger
    document.getElementById('editTrigger').value = d.trigger || 'time';
    onTriggerChange();

    // Duration / distance
    if (d.trigger === 'time') {
      document.getElementById('editDuration').value = d.duration ? formatDuration(d.duration) : '5:00';
    } else {
      document.getElementById('editDistance').value = d.distance || 1000;
    }

    // Pace
    document.getElementById('editPace').value = d.pace || '5:00';
    onPaceInput(d.pace || '5:00');

    // Incline
    const inc = d.incline || 0;
    document.getElementById('editInclineSlider').value = inc;
    document.getElementById('editInclineVal').textContent = inc.toFixed(1) + '%';

    document.getElementById('stepModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('stepModal').classList.remove('open');
  }

  function onTriggerChange() {
    const trigger = document.getElementById('editTrigger').value;
    document.getElementById('durationField').style.display =
      trigger === 'time' ? 'block' : 'none';
    document.getElementById('distanceField').style.display =
      trigger === 'distance' ? 'block' : 'none';
  }

  function onTypeChange() {
    // Could auto-suggest pace ranges per type in future
  }

  function saveStep() {
    const type    = document.getElementById('editType').value;
    const trigger = document.getElementById('editTrigger').value;
    const pace    = document.getElementById('editPace').value;
    const incline = parseFloat(document.getElementById('editInclineSlider').value);

    if (!paceToKph(pace)) { toast('Invalid pace format (use mm:ss)', 'error'); return; }

    let step = { type, trigger, pace, incline };

    if (trigger === 'time') {
      const dur = parseDuration(document.getElementById('editDuration').value);
      if (!dur) { toast('Invalid duration format (use mm:ss)', 'error'); return; }
      step.duration = dur;
    } else {
      const dist = parseInt(document.getElementById('editDistance').value);
      if (!dist || dist < 50) { toast('Invalid distance', 'error'); return; }
      step.distance = dist;
    }

    if (_modalParentIndex !== null) {
      if (_modalIsNew) {
        workout.steps[_modalParentIndex].steps.push(step);
      } else {
        workout.steps[_modalParentIndex].steps[_modalStepIndex] = step;
      }
    } else {
      if (_modalIsNew) {
        workout.steps.push(step);
      } else {
        workout.steps[_modalStepIndex] = step;
      }
    }

    closeModal();
    renderSteps();
    saveDraftSilent();
  }

  // ── PACE INPUTS ──────────────────────────────────────────
  function onPaceInput(val) {
    const kph = paceToKph(val);
    if (kph) {
      document.getElementById('paceKph').textContent = kph.toFixed(1) + ' kph';
      document.getElementById('paceSlider').value = kph;
    } else {
      document.getElementById('paceKph').textContent = '-- kph';
    }
  }
  function onPaceSlider(val) {
    const kph  = parseFloat(val);
    const pace = kphToPace(kph);
    document.getElementById('editPace').value = pace;
    document.getElementById('paceKph').textContent = kph.toFixed(1) + ' kph';
  }

  // ── PREVIEW ──────────────────────────────────────────────
  function flattenForPreview(steps) {
    const flat = [];
    steps.forEach(s => {
      if (s.type === 'repeat') {
        for (let i = 0; i < (s.count||1); i++) {
          (s.steps||[]).forEach(sub => flat.push(sub));
        }
      } else {
        flat.push(s);
      }
    });
    return flat;
  }

  function renderPreview() {
    const flat = flattenForPreview(workout.steps);
    const totalSecs = flat.reduce((a, s) => a + stepEstSeconds(s), 0);
    const bar = document.getElementById('previewBar');
    bar.innerHTML = '';

    flat.forEach(s => {
      const secs = stepEstSeconds(s);
      const pct  = totalSecs > 0 ? (secs / totalSecs * 100) : 0;
      const seg  = document.createElement('div');
      seg.className = 'preview-segment';
      seg.style.cssText = `flex:${pct};background:${stepColor(s.type)};min-width:2px`;
      bar.appendChild(seg);
    });

    document.getElementById('previewSteps').textContent =
      `${flat.length} step${flat.length !== 1 ? 's' : ''}`;
    document.getElementById('previewDuration').textContent =
      `~${Math.round(totalSecs / 60)} min`;
  }

  // ── DRAFT SAVE / LOAD ────────────────────────────────────
  function saveDraft() {
    workout.name        = document.getElementById('workoutName').value.trim();
    workout.description = document.getElementById('workoutDesc').value.trim();
    if (!workout.name) { toast('Add a workout name first', 'error'); return; }
    localStorage.setItem('treadmill_draft', JSON.stringify(workout));
    toast('Draft saved locally', 'ok');
  }

  function saveDraftSilent() {
    workout.name        = document.getElementById('workoutName').value.trim();
    workout.description = document.getElementById('workoutDesc').value.trim();
    localStorage.setItem('treadmill_draft', JSON.stringify(workout));
  }

  function loadDraft() {
    const raw = localStorage.getItem('treadmill_draft');
    if (!raw) return;
    try {
      workout = JSON.parse(raw);
      document.getElementById('workoutName').value = workout.name || '';
      document.getElementById('workoutDesc').value = workout.description || '';
      renderSteps();
    } catch(e) { console.warn('Draft load failed', e); }
  }

  function newWorkout() {
    workout = { name:'', description:'', steps:[] };
    localStorage.setItem('treadmill_draft', JSON.stringify(workout));
    document.getElementById('workoutName').value = '';
    document.getElementById('workoutDesc').value = '';
    renderSteps();
  }

  // ── SAVE TO PI ───────────────────────────────────────────
  async function saveToPi() {
    workout.name        = document.getElementById('workoutName').value.trim();
    workout.description = document.getElementById('workoutDesc').value.trim();
    if (!workout.name)        { toast('Add a workout name first', 'error'); return; }
    if (!workout.steps.length){ toast('Add at least one step', 'error'); return; }

    workout.id = workout.id || uid();

    // Save locally first
    const saved = getSavedWorkouts();
    const existing = saved.findIndex(w => w.id === workout.id);
    if (existing >= 0) saved[existing] = workout;
    else saved.push(workout);
    localStorage.setItem('treadmill_workouts', JSON.stringify(saved));

    // Try Pi server
    try {
      const res = await fetch('/api/workouts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(workout)
      });
      if (res.ok) {
        toast('Saved to Pi', 'ok');
      } else {
        toast('Saved locally (Pi unreachable)', 'ok');
      }
    } catch(e) {
      toast('Saved locally (Pi unreachable)', 'ok');
    }

    renderSavedList();
  }

  // ── SAVED WORKOUTS ───────────────────────────────────────
  function getSavedWorkouts() {
    try { return JSON.parse(localStorage.getItem('treadmill_workouts') || '[]'); }
    catch(e) { return []; }
  }

  function renderSavedList() {
    const list = document.getElementById('savedList');
    const saved = getSavedWorkouts();
    list.innerHTML = '';

    if (!saved.length) {
      list.innerHTML = '<div class="empty-state">NO SAVED WORKOUTS</div>';
      return;
    }

    saved.forEach(w => {
      const flat = flattenForPreview(w.steps || []);
      const totalSecs = flat.reduce((a, s) => a + stepEstSeconds(s), 0);

      const item = document.createElement('div');
      item.className = 'saved-item';
      item.innerHTML = `
        <div style="flex:1">
          <div class="sname">${w.name}</div>
          <div class="sdesc">${w.description || ''} · ~${Math.round(totalSecs/60)} min</div>
        </div>
        <div class="sactions">
          <button onclick="loadSaved('${w.id}')">EDIT</button>
          <button class="del" onclick="deleteSaved('${w.id}')">✕</button>
        </div>
      `;
      list.appendChild(item);
    });
  }

  function loadSaved(id) {
    const saved = getSavedWorkouts();
    const w = saved.find(x => x.id === id);
    if (!w) return;
    workout = JSON.parse(JSON.stringify(w));
    document.getElementById('workoutName').value = workout.name || '';
    document.getElementById('workoutDesc').value = workout.description || '';
    renderSteps();
    window.scrollTo(0, 0);
    toast('Workout loaded for editing', 'ok');
  }

  function deleteSaved(id) {
    let saved = getSavedWorkouts();
    saved = saved.filter(w => w.id !== id);
    localStorage.setItem('treadmill_workouts', JSON.stringify(saved));

    // Also try to delete from Pi
    fetch(`/api/workouts/${id}`, { method:'DELETE' }).catch(() => {});
    renderSavedList();
    toast('Workout deleted', 'ok');
  }

  // ── TOAST ────────────────────────────────────────────────
  let toastTimer = null;
  function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = `toast show ${type || ''}`;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ── INIT ─────────────────────────────────────────────────
  loadDraft();
  renderSavedList();
</script>
</body>
</html>
