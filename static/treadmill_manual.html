<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treadmill — Manual</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="/static/common.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:var(--bg); color:#fff; font-family:var(--font); min-height:100vh; display:flex; flex-direction:column; max-width:480px; margin:0 auto; }

    .mode-bar { padding:8px 24px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
    .mode-indicator { width:8px; height:8px; border-radius:50%; transition:background 0.3s,box-shadow 0.3s; background:var(--dim); }
    .mode-label { font-size:11px; letter-spacing:3px; color:var(--dim); }

    /* Live display — same format as the workout page: a ring either side
       (speed left, heart rate right) with the live stat grid between them. */
    .live-stats { padding:20px 24px; display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:nowrap; border-bottom:1px solid var(--border); }
    .ring-wrap { position:relative; width:110px; height:110px; flex-shrink:0; }
    .ring-wrap svg { transform:rotate(-90deg); }
    .ring-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
    .ring-kph { font-size:22px; font-weight:500; letter-spacing:-1px; line-height:1; }
    .ring-unit { font-size:9px; color:var(--dim); letter-spacing:2px; margin-top:2px; }
    .live-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; flex:1; min-width:0; }
    .lbl { font-size:9px; color:var(--dim); letter-spacing:2px; margin-bottom:2px; white-space:nowrap; }
    .val { font-size:16px; letter-spacing:-0.5px; white-space:nowrap; }
    .unit { font-size:10px; color:var(--dim); margin-left:3px; }

    .controls { padding:24px; display:flex; flex-direction:column; gap:16px; flex:1; justify-content:center; }
    .btn-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
    button { font-family:var(--font); border:none; border-radius:4px; cursor:pointer; font-size:11px; letter-spacing:1px; transition:all 0.2s; white-space:nowrap; }
    button:disabled { cursor:not-allowed; }

    .btn-start { padding:16px 4px; background:var(--orange); color:#000; font-weight:bold; }
    .btn-start:disabled { background:#111; color:var(--dimmer); }
    .btn-pause { padding:16px 4px; background:var(--bg3); color:var(--amber); border:1px solid var(--amber); }
    .btn-pause:disabled { color:var(--dimmer); border-color:var(--bg3); background:#111; }
    .btn-resume { padding:16px 4px; background:var(--bg3); color:var(--blue); border:1px solid var(--blue); }
    .btn-resume:disabled { color:var(--dimmer); border-color:var(--bg3); background:#111; }
    .btn-stop { padding:16px 4px; background:var(--bg3); color:var(--red); border:1px solid var(--red); }
    .btn-stop:disabled { color:var(--dimmer); border-color:var(--bg3); background:#111; }

    /* Still used by the slider headers below (PACE / INCLINE labels). */
    .stat-label { font-size:9px; color:var(--dim); letter-spacing:2px; }

    .slider-card { background:var(--bg2); border-radius:4px; padding:16px; border:1px solid var(--border); }
    .slider-header { display:flex; justify-content:space-between; margin-bottom:12px; }
    .slider-current { font-size:14px; }
    .slider-current .pace { font-size:10px; color:var(--dim); margin-left:6px; }
    input[type=range] { width:100%; margin-bottom:10px; height:4px; border-radius:2px; outline:none; cursor:pointer; }
    input[type=range].orange { accent-color:var(--orange); }
    input[type=range].blue   { accent-color:var(--blue); }

    .btn-set { width:100%; padding:10px; font-size:11px; letter-spacing:2px; }
    .btn-set.orange { background:#ff880020; color:var(--orange); border:1px solid #ff880040; }
    .btn-set.blue   { background:#0088ff20; color:var(--blue);   border:1px solid #0088ff40; }
    .btn-set:hover:not(:disabled) { opacity:0.8; }
    .btn-set:disabled { opacity:0.3; cursor:not-allowed; }

    .error-bar { display:none; padding:8px 24px; background:#ff333310; border-bottom:1px solid #ff333340; font-size:10px; letter-spacing:2px; color:var(--red); }
    .error-bar.show { display:block; }

    /* Wider layout for the 10.1" landscape touchscreen — avoids the whole
       UI being squeezed into a narrow phone-width column with dead space
       either side, and scales every element up for glancing at while
       actually running, not just reading at arm's length.
       max-width bumped from 980px to 1360px to actually fill a 1280px-wide
       kiosk display — adjust to match your panel's actual resolution if
       it differs. */
    @media (min-width: 700px) {
      body { max-width: 1360px; }

      .mode-bar { padding:18px 44px; gap:20px; }
      .mode-indicator { width:18px; height:18px; }
      .mode-label { font-size:26px; letter-spacing:4px; }

      /* clamp()-based fluid sizing rather than fixed px: scales to
         whatever the real panel width actually is instead of guessing a
         pixel value that may not fit. flex-wrap:nowrap (set on .live-stats
         in the base rules above — see the shared block) guarantees this
         row can never wrap onto a second line again; everything shrinks
         together to fit instead. */
      .live-stats { padding:24px 44px; gap:clamp(16px, 2.4vw, 40px); }
      .ring-wrap { width:clamp(140px, 15vw, 220px); height:clamp(140px, 15vw, 220px); }
      .ring-kph { font-size:clamp(26px, 3.4vw, 46px); }
      .ring-unit { font-size:clamp(10px, 1.2vw, 16px); letter-spacing:2px; }
      .live-grid { grid-template-columns:repeat(4,1fr); gap:16px clamp(10px, 1.6vw, 28px); }
      .lbl { font-size:clamp(10px, 1.3vw, 18px); letter-spacing:2px; }
      .val { font-size:clamp(20px, 2.9vw, 42px); }
      .unit { font-size:clamp(10px, 1.3vw, 18px); }

      .stat-label { font-size:18px; letter-spacing:3px; }

      .controls { padding:36px 44px; gap:24px; }
      .btn-grid { gap:14px; }
      button { font-size:19px; letter-spacing:2px; }
      .btn-start, .btn-pause, .btn-resume, .btn-stop { padding:34px 4px; }

      .slider-card { padding:24px; }
      .slider-current { font-size:24px; }
      .slider-current .pace { font-size:17px; }
      input[type=range] { height:10px; margin-bottom:16px; }
      .btn-set { padding:18px; font-size:19px; letter-spacing:3px; }

      .error-bar { padding:14px 44px; font-size:17px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">Treadmill</div>
    <nav class="nav">
      <a href="/" class="active">MANUAL</a>
      <a href="/workout">WORKOUT</a>
      <a href="/build">BUILD</a>
    </nav>
    <button class="ble-btn disconnected" id="bleBtn" onclick="toggleConnect()">CONNECT</button>
  </div>

  <div class="error-bar" id="errorBar"></div>

  <div class="mode-bar">
    <div class="mode-indicator" id="modeIndicator"></div>
    <span class="mode-label" id="modeLabel">IDLE</span>
  </div>

  <div class="live-stats">
    <div class="ring-wrap">
      <svg width="100%" height="100%" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r="42" fill="none" stroke="#1a1a1a" stroke-width="8"/>
        <circle cx="55" cy="55" r="42" fill="none" stroke="#ff8800" stroke-width="8"
          stroke-linecap="round" id="speedRing" stroke-dasharray="0 263.9"
          style="transition:stroke-dasharray 0.5s ease;filter:drop-shadow(0 0 5px #ff8800)"/>
      </svg>
      <div class="ring-center">
        <div class="ring-kph" id="dispKph">0.0</div>
        <div class="ring-unit">KPH</div>
      </div>
    </div>
    <div class="live-grid">
      <div><div class="lbl">PACE</div><div class="val" id="dispPace">--:--<span class="unit">/km</span></div></div>
      <div><div class="lbl">DISTANCE</div><div class="val" id="dispDist">0.000<span class="unit">km</span></div></div>
      <div><div class="lbl">TIME</div><div class="val" id="dispTime">0:00</div></div>
      <div><div class="lbl">INCLINE</div><div class="val" id="dispIncline">0.0<span class="unit">%</span></div></div>
    </div>
    <div class="ring-wrap">
      <svg width="100%" height="100%" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r="42" fill="none" stroke="#1a1a1a" stroke-width="8"/>
        <circle cx="55" cy="55" r="42" fill="none" stroke="#ff3333" stroke-width="8"
          stroke-linecap="round" id="hrRing" stroke-dasharray="0 263.9"
          style="transition:stroke-dasharray 0.5s ease;filter:drop-shadow(0 0 5px #ff3333)"/>
      </svg>
      <div class="ring-center">
        <div class="ring-kph" id="dispHr">--</div>
        <div class="ring-unit">BPM</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="btn-grid">
      <button class="btn-start" id="btnStart" onclick="cmdStart()" disabled>START</button>
      <button class="btn-pause" id="btnPause" onclick="cmdPause()" disabled>PAUSE</button>
      <button class="btn-resume" id="btnResume" onclick="cmdResume()" disabled>RESUME</button>
      <button class="btn-stop" id="btnStop" onclick="cmdStop()" disabled>STOP</button>
    </div>

    <div class="slider-card">
      <div class="slider-header">
        <span class="stat-label">PACE</span>
        <span class="slider-current" style="color:var(--orange)">
          <span id="speedPace">7:30</span>/km
          <span class="pace" id="speedVal">8.0 kph</span>
        </span>
      </div>
      <input type="range" class="orange" id="speedSlider" min="2" max="18" step="0.5" value="8"
        oninput="onSpeedSlide(this.value)">
      <button class="btn-set orange" id="btnSetSpeed" onclick="cmdSetSpeed()" disabled>SET PACE</button>
    </div>

    <div class="slider-card">
      <div class="slider-header">
        <span class="stat-label">INCLINE</span>
        <span class="slider-current" style="color:var(--blue)">
          <span id="inclineVal">0.0</span>%
        </span>
      </div>
      <input type="range" class="blue" id="inclineSlider" min="0" max="10" step="0.5" value="0"
        oninput="onInclineSlide(this.value)">
      <button class="btn-set blue" id="btnSetIncline" onclick="cmdSetIncline()" disabled>SET INCLINE</button>
    </div>
  </div>

<script>
  const MODES = { 1:'IDLE', 2:'RUNNING', 3:'PAUSED', 4:'SUMMARY' };
  const MODE_COLORS = { 1:'#ffffff', 2:'#ff8800', 3:'#ffaa00', 4:'#0088ff' };
  const CIRC = 2 * Math.PI * 42;
  const HR_MAX = 190;   // ring scale — full ring = 190bpm

  let bleState  = 'disconnected';
  let treadmill = { mode:1, currentKph:0, currentIncline:0, currentDistance:0, currentTime:0, pulse:0 };

  // ── WebSocket ─────────────────────────────────────────────
  const ws = new WebSocket('ws://192.168.1.45/ws');
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'ble_state') { bleState = d.bleState; updateBleBtn(); renderButtons(); }
    if (d.type === 'status')    { bleState = d.bleState || bleState; treadmill = { ...treadmill, ...d }; render(); }
    if (d.type === 'error')     { showError(d.message); }
  };

  // ── Connect ───────────────────────────────────────────────
  function toggleConnect() {
    if (bleState === 'connected')  { ws.send(JSON.stringify({ cmd:'disconnect' })); return; }
    if (bleState === 'connecting') { return; }
    ws.send(JSON.stringify({ cmd:'connect' }));
  }
  function updateBleBtn() {
    const labels = { connected:'BLE ●', connecting:'CONNECTING...', disconnected:'CONNECT' };
    setBleBtn(bleState, labels[bleState] || 'CONNECT');
  }
  function setBleBtn(cls, label) {
    const b = document.getElementById('bleBtn');
    b.className   = `ble-btn ${cls}`;
    b.textContent = label;
  }

  // ── Commands ──────────────────────────────────────────────
  function cmdStart() { const kph = parseFloat(document.getElementById('speedSlider').value); ws.send(JSON.stringify({ cmd:'start', value:kph })); }
  function cmdPause() { ws.send(JSON.stringify({ cmd:'pause' })); }
  function cmdResume(){ const kph = parseFloat(document.getElementById('speedSlider').value); ws.send(JSON.stringify({ cmd:'resume', value:kph })); }
  function cmdStop()  { ws.send(JSON.stringify({ cmd:'stop' })); }
  function cmdSetSpeed()   { const kph = parseFloat(document.getElementById('speedSlider').value); ws.send(JSON.stringify({ cmd:'speed', value:kph })); }
  function cmdSetIncline() { ws.send(JSON.stringify({ cmd:'incline', value: parseFloat(document.getElementById('inclineSlider').value) })); }

  // ── Sliders ───────────────────────────────────────────────
  function onSpeedSlide(v)   { document.getElementById('speedPace').textContent = formatPace(v); document.getElementById('speedVal').textContent = parseFloat(v).toFixed(1)+' kph'; }
  function onInclineSlide(v) { document.getElementById('inclineVal').textContent = parseFloat(v).toFixed(1); }

  // ── Render ────────────────────────────────────────────────
  function render() {
    const s     = treadmill;
    const color = MODE_COLORS[s.mode] || '#ffffff';
    document.getElementById('modeIndicator').style.background = color;
    document.getElementById('modeIndicator').style.boxShadow  = `0 0 8px ${color}`;
    document.getElementById('modeLabel').textContent = MODES[s.mode] || 'UNKNOWN';
    document.getElementById('modeLabel').style.color = color;

    const pct = Math.min(s.currentKph/20, 1);
    document.getElementById('speedRing').setAttribute('stroke-dasharray', `${pct*CIRC} ${CIRC}`);
    document.getElementById('dispKph').textContent  = s.currentKph.toFixed(1);

    const pulse   = s.pulse || 0;
    const pctHr   = Math.min(pulse / HR_MAX, 1);
    document.getElementById('hrRing').setAttribute('stroke-dasharray', `${pctHr*CIRC} ${CIRC}`);
    document.getElementById('dispHr').textContent = pulse > 0 ? Math.round(pulse) : '--';

    document.getElementById('dispPace').innerHTML    = formatPace(s.currentKph)+'<span class="unit">/km</span>';
    document.getElementById('dispIncline').innerHTML = s.currentIncline.toFixed(1)+'<span class="unit">%</span>';
    document.getElementById('dispDist').innerHTML    = (s.currentDistance/1000).toFixed(3)+'<span class="unit">km</span>';
    document.getElementById('dispTime').textContent  = formatTime(s.currentTime);
    renderButtons();
  }

  function renderButtons() {
    const isIdle    = treadmill.mode === 1;
    const isRunning = treadmill.mode === 2;
    const isPaused  = treadmill.mode === 3;
    const ok        = bleState === 'connected';

    document.getElementById('btnStart').disabled     = !ok || !isIdle;
    document.getElementById('btnPause').disabled     = !ok || !isRunning;
    document.getElementById('btnResume').disabled    = !ok || !isPaused;
    document.getElementById('btnStop').disabled      = !ok || isIdle;
    document.getElementById('btnSetSpeed').disabled  = !ok || !isRunning;
    document.getElementById('btnSetIncline').disabled = !ok;
  }

  // ── Utilities ─────────────────────────────────────────────
  function formatTime(s) {
    const m = Math.floor(s/60);
    return `${m}:${String(s%60).padStart(2,'0')}`;
  }
  function formatPace(kph) {
    if (!kph || kph < 0.1) return '--:--';
    const sec = Math.round(3600/kph);
    return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  }

  let errorTimer = null;
  function showError(msg) {
    const el = document.getElementById('errorBar');
    el.textContent = msg;
    el.classList.add('show');
    if (errorTimer) clearTimeout(errorTimer);
    errorTimer = setTimeout(() => el.classList.remove('show'), 4000);
  }

  render();
</script>
</body>
</html>
