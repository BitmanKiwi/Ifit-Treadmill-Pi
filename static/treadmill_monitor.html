<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treadmill — Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- common.css supplies the shared color variables only — this page's
       topbar/grid layout is intentionally its own fluid vw-based design,
       not the fixed-breakpoint .header/.nav used by the other pages. -->
  <link href="/static/common.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height:100%; }
    body {
      background:var(--bg); color:#fff; font-family:var(--font);
      display:flex; flex-direction:column; overflow:hidden;
    }

    .topbar {
      display:flex; justify-content:space-between; align-items:center;
      padding: 2.4vh 3vw; flex: 0 0 auto;
    }
    .title { font-size: 2.6vw; letter-spacing: 0.4vw; color: var(--dim); min-width: 1px; }
    .nav { display:flex; gap:2.4vw; }
    .nav a { font-size: 2.1vw; letter-spacing: 0.2vw; text-decoration:none; color:var(--dim); }
    .nav a.active { color: var(--orange); }
    .status-cluster { display:flex; align-items:center; gap:1.5vw; }
    .mode-pill {
      font-size: 1.9vw; letter-spacing: 0.3vw; padding: 0.9vh 1.4vw;
      border-radius: 3vw; border: 1px solid var(--dim); color: var(--dim);
    }
    .reg-note {
      font-size: 1.5vw; letter-spacing: 0.15vw; color: var(--amber);
      opacity: 0; transition: opacity 0.3s;
    }
    .reg-note.show { opacity: 1; }

    .grid {
      flex: 1 1 auto; display:grid;
      grid-template-columns: 1.15fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1px; background: var(--border); min-height: 0;
    }
    .cell {
      background: var(--bg); display:flex; flex-direction:column;
      justify-content:center; align-items:center; padding: 2vh 2vw;
      min-width: 0; min-height: 0;
    }
    .cell.speed { grid-row: 1 / 3; }
    .label { font-size: 1.4vw; letter-spacing: 0.35vw; color: var(--dim); margin-bottom: 1vh; }
    .value { font-weight: 400; line-height: 1; white-space: nowrap; }
    .cell.speed .value  { font-size: 14vw; color: var(--orange); }
    .cell.pace  .value  { font-size: 9vw; }
    .cell.dist  .value  { font-size: 9vw; }
    .cell.time  .value  { font-size: 9vw; }
    .cell.incl  .value  { font-size: 9vw; }
    .unit { font-size: 0.35em; color: var(--dim); margin-left: 0.5vw; }

    .disconnected-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display:none; flex-direction:column; align-items:center; justify-content:center;
      gap: 2vh; z-index: 10;
    }
    .disconnected-overlay.show { display:flex; }
    .disconnected-overlay .msg { font-size: 2vw; letter-spacing: 0.2vw; color: var(--dim); }

    @media (max-width: 700px) {
      .title, .nav a, .mode-pill, .reg-note { font-size: 4vw; }
      .label { font-size: 4vw; }
      .cell.speed .value { font-size: 24vw; }
      .cell.pace .value, .cell.dist .value, .cell.time .value, .cell.incl .value { font-size: 13vw; }
      .grid { grid-template-columns: 1fr; grid-template-rows: 1.2fr 0.7fr 0.7fr 0.7fr 0.7fr; }
      .cell.speed { grid-row: auto; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="title">Treadmill</div>
    <nav class="nav">
      <a href="/">MANUAL</a>
      <a href="/workout">WORKOUT</a>
      <a href="/monitor" class="active">MONITOR</a>
      <a href="/build">BUILD</a>
    </nav>
    <div class="status-cluster">
      <div class="reg-note" id="regNote"></div>
      <div class="mode-pill" id="modePill">IDLE</div>
    </div>
  </div>

  <div class="grid">
    <div class="cell speed">
      <div class="label">SPEED</div>
      <div class="value" id="dispKph">0.0<span class="unit">kph</span></div>
    </div>
    <div class="cell pace">
      <div class="label">PACE</div>
      <div class="value" id="dispPace">--:--<span class="unit">/km</span></div>
    </div>
    <div class="cell incl">
      <div class="label">INCLINE</div>
      <div class="value" id="dispIncline">0.0<span class="unit">%</span></div>
    </div>
    <div class="cell dist">
      <div class="label">DISTANCE</div>
      <div class="value" id="dispDist">0.00<span class="unit">km</span></div>
    </div>
    <div class="cell time">
      <div class="label">TIME</div>
      <div class="value" id="dispTime">0:00</div>
    </div>
  </div>

  <div class="disconnected-overlay" id="discOverlay">
    <div class="msg" id="discMsg">BLE DISCONNECTED</div>
  </div>

<script>
  const MODES        = { 1:'IDLE', 2:'RUNNING', 3:'PAUSED', 4:'SUMMARY' };
  const MODE_COLORS   = { 1:'#ffffff', 2:'#ff8800', 3:'#ffaa00', 4:'#0088ff' };
  let bleState  = 'disconnected';
  let treadmill = { mode:1, currentKph:0, currentIncline:0, currentDistance:0, currentTime:0, register:{} };

  // ── WebSocket — read-only, this page never sends commands ───
  const ws = new WebSocket(`ws://${location.hostname}/ws`);
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'ble_state') { bleState = d.bleState; render(); }
    if (d.type === 'status')    { bleState = d.bleState || bleState; treadmill = { ...treadmill, ...d }; render(); }
  };

  function render() {
    const s = treadmill;
    const color = MODE_COLORS[s.mode] || '#ffffff';

    document.getElementById('modePill').textContent   = MODES[s.mode] || 'UNKNOWN';
    document.getElementById('modePill').style.color   = color;
    document.getElementById('modePill').style.borderColor = color;

    document.getElementById('dispKph').innerHTML     = s.currentKph.toFixed(1) + '<span class="unit">kph</span>';
    document.getElementById('dispPace').innerHTML    = formatPace(s.currentKph) + '<span class="unit">/km</span>';
    document.getElementById('dispIncline').innerHTML = s.currentIncline.toFixed(1) + '<span class="unit">%</span>';
    document.getElementById('dispDist').innerHTML    = (s.currentDistance/1000).toFixed(2) + '<span class="unit">km</span>';
    document.getElementById('dispTime').textContent  = formatTime(s.currentTime);

    // Register status — makes a paused-vs-dropped workout obvious at a glance,
    // rather than the numbers just quietly going stale.
    const reg = s.register || {};
    const note = document.getElementById('regNote');
    if (reg.active && reg.paused) {
      note.textContent = 'WORKOUT PAUSED'; note.classList.add('show');
    } else if (reg.active && bleState !== 'connected') {
      note.textContent = 'WORKOUT ACTIVE — BLE LOST'; note.classList.add('show');
    } else {
      note.classList.remove('show');
    }

    const overlay = document.getElementById('discOverlay');
    if (bleState !== 'connected') {
      overlay.classList.add('show');
      document.getElementById('discMsg').textContent =
        reg.active ? 'BLE DISCONNECTED — WORKOUT STILL REGISTERED' : 'BLE DISCONNECTED';
    } else {
      overlay.classList.remove('show');
    }
  }

  function formatTime(s) {
    const m = Math.floor(s/60);
    return `${m}:${String(s%60).padStart(2,'0')}`;
  }
  function formatPace(kph) {
    if (!kph || kph < 0.1) return '--:--';
    const sec = Math.round(3600/kph);
    return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  }

  render();
</script>
</body>
</html>
